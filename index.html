<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Academic Deadlines Countdown Timer</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
  <script type="text/javascript">

var datasource = "data.json"
var backi = -1;
var backapprox = false;

var deadlines = [];
var deadlines_approx = [];

function timeLeftDescription(x) {
  var t = x.getTime();
  if (t < 0) t = 0;

  var tseconds = t / 1000;
  var seconds = Math.floor(tseconds) % 60;
  var tminutes = tseconds / 60;
  var minutes = Math.floor(tminutes) % 60;
  var thours = tminutes / 60;
  var hours = Math.floor(thours) % 24;
  var tdays = thours / 24;
  var days = Math.floor(tdays);

  return days + " days, " +
    ((hours < 10) ? "0" : "") + hours + "h " +
    ((minutes < 10) ? "0" : "") + minutes + "m " +
    ((seconds < 10) ? "0" : "") + seconds + "s";
}

$.ajaxSetup({ 'async': false });
$.getJSON(datasource, function (data) {
  var now = new Date();
  for (var i in data) {
    data[i].deadline_str = data[i].deadline;
    let d = new Date(data[i].deadline);
    let wasApprox = data[i].approx;

    while (d < now) {
      d.setFullYear(d.getFullYear() + 1);
    }

    data[i].deadline = d;

    if (wasApprox) {
      deadlines_approx.push(data[i]);
    } else {
      deadlines.push(data[i]);
    }
  }

  deadlines.sort((a, b) => a.deadline - b.deadline);
  deadlines_approx.sort((a, b) => a.deadline - b.deadline);
});

function refreshDisplay() {
  var dc = new Date();
  $("#currtime").text("Current time: " + dc);

  for (var i = 0; i < deadlines.length; i++) {
    refreshDeadline(i, deadlines[i], dc, false);
  }
  for (var i = 0; i < deadlines_approx.length; i++) {
    refreshDeadline(i, deadlines_approx[i], dc, true);
  }
}

function refreshDeadline(i, dl, dc, isApprox) {
  var suffix = isApprox ? "_approx" : "";
  var warningString = isApprox ? "based on a previous year!" : "";

  var timeLeft = new Date(dl.deadline.getTime() - dc.getTime());
  var venue = dl.venue;

  if ("link" in dl)
    venue = "<span class='vld' id='link" + suffix + i + "'>" + venue + "</span>";

  $("#deadline" + suffix + i).html(
    "<div class='tld'>" + timeLeftDescription(timeLeft) + "</div>" +
    "<div class='vd'>" + venue + "</div>" +
    "<div class='ad'>" + dl.area + "</div>" +
    "<div class='td'> Deadline: " + dl.deadline.toString() + "</div>" +
    "<div class='wd'>" + warningString + "</div>" +
    "<div class='hd' id='hide" + suffix + i + "'>hide</div>"
  );

  $("#hide" + suffix + i).click(function () {
    $("#deadline" + suffix + i).hide();
    return false;
  });

  if ("link" in dl) {
    $("#link" + suffix + i).click(function () {
      window.open(dl.link);
      return false;
    });
  }

  if (backi !== -1) {
    let backdl = backapprox ? deadlines_approx[backi] : deadlines[backi];
    let venue = backdl.venue;
    if ("link" in backdl)
      venue = "<span class='vld'>" + venue + "</span>";
    let timeLeft = new Date(backdl.deadline.getTime() - dc.getTime());
    $("#backfacetext").html(
      venue + "<br>" +
      timeLeftDescription(timeLeft) + "<br>" +
      "<div class='tdb'>" + backdl.deadline_str + "<br>(" + backdl.deadline.toString() + ")</div>"
    );
  }
}

$(document).ready(function () {
  for (var i = 0; i < deadlines.length; i++) {
    $("<div class='dd' id='deadline" + i + "'></div>").appendTo("#deadlinesdiv").fadeIn(200 * (i + 1)).click((function (z) {
      return function () {
        backi = z;
        backapprox = false;
        $("#backface").fadeIn("slow");
      }
    })(i));
  }

  for (var i = 0; i < deadlines_approx.length; i++) {
    $("<div class='dd approx' id='deadline_approx" + i + "'></div>").appendTo("#deadlinesdiv").fadeIn(200 * (i + 1)).click((function (z) {
      return function () {
        backi = z;
        backapprox = true;
        $("#backface").fadeIn("slow");
      }
    })(i));
  }

  setInterval(refreshDisplay, 1000);
  refreshDisplay();

  $("#backface").click(function () {
    backi = -1;
    $("#backface").fadeOut("slow");
  });

  $("#makeown").click(function () {
    backi = -1;
    $("#instrown").fadeToggle();
  });
});
  </script>

  <style>
    body {
      font-family: Verdana, Helvetica, sans-serif;
      font-size: 12px;
      margin: 0;
      background-color: white;
      color: #222;
    }

    #surround {
      margin: 50px auto;
      width: 600px;
      background-color: white;
    }

    h1 {
      font-size: 35px;
    }

    .dd {
      padding: 10px;
      margin-bottom: 3px;
      background-color: #EEE;
      border: 1px solid #DDD;
      cursor: pointer;
      position: relative;
    }

    .dd:hover {
      background-color: #DDD;
      border-color: #AAA;
    }

    .dd.approx {
      background-color: #F9F9F9;
    }

    .tld {
      float: right;
      font-size: 18px;
      font-weight: bold;
      margin-top: 16px;
    }

    .vd {
      font-weight: bold;
      font-size: 16px;
    }

    .vld:hover {
      text-decoration: underline;
      cursor: pointer;
    }

    .ad {
      font-family: monospace;
    }

    .tdb {
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
      margin-top: 16px;
    }

    .wd {
      position: absolute;
      bottom: 10px;
      right: 8px;
      color: #700;
      font-size: 10px;
    }

    .hd {
      position: absolute;
      top: 5px;
      right: 8px;
      color: #808080;
      font-size: 10px;
    }

    #backface {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background-color: white;
      display: none;
      z-index: 888;
    }

    #backfacetext {
      position: absolute;
      top: 40%;
      left: 35%;
      font-size: 28px;
      width: 50%;
      color: #555;
      font-weight: bold;
      z-index: 889;
    }

    #makeown {
      text-decoration: underline;
      color: #008;
      cursor: pointer;
    }

    #instrown {
      display: none;
      background-color: #EEE;
      border-radius: 5px;
      padding: 5px;
    }
  </style>
</head>

<body>
  <div id="backface"><div id="backfacetext"></div></div>
  <div id="surround">
    <a href="https://github.com/jiaqingxie/academic_countdown">Source</a>
    <h1> Academic Countdown for AI Chemist and Biologist</h1>
    <div id="currtime"></div>
    <div id="deadlinesdiv"></div>
    <div id="bottompart">
      <div id="makeown">Info</div>
      <div id="instrown">
        <p>How to make your own countdown: Download this file (index.html) or fork the project from <a href="https://github.com/jiaqingxie/academic_countdown">GitHub</a> and modify <code>data.json</code>.</p>
      </div>
    </div>
  </div>
</body>
</html>
